{% extends 'Students/base.html' %}


{% block content %}
{% if user.is_authenticated %} 
<div class="container" style="margin-top: 70px; min-height: 600px;">
    <h1>{{ class.name }} - Class Details</h1>
    <p><strong>Description:</strong> {{ class.description }}</p>

    <br>
    <a href="{% url 'class_list' %}" class="btn btn-secondary">Back to class list</a>
    <a href="{% url 'class_create' %}" class="btn btn-primary">Edit Class</a>
</div>

{% else %}   
<h1 class="text-danger">You are not allow, Please Login In!</h1>
{% endif %}



{% endblock content %}
