{% extends 'Students/base.html' %}


{% block content %}
<div class="container" style="margin-top: 70px; min-height: 600px;">
    <h2>{{ form.instance.pk|yesno:"Edit Attendance,Add Attendance" }}</h2>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        {{ form.as_p }}
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'attendance_list' %}" class="btn btn-secondary">Back Attendance List</a>
    </form>


  
</div>
{% endblock content %}
