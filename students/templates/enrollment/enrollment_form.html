{% extends 'Students/base.html' %}


{% block content %}
<div class="container" style="margin-top: 70px; min-height: 600px;">
    <h1 class="mb-4">Add Enrollment</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mb-3">
            <button type="submit" class="btn btn-success">Save Enrollment</button>
            <a href="{% url 'enrollment_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
  
</div>
{% endblock content %}
