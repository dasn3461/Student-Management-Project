{% extends 'Students/base.html' %}


{% block content %}
<div class="container" style="margin-top: 70px; min-height: 600px;">
    <h1>{% if form.instance.pk %}Update{% else %}Add{% endif %} Student</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
    <br>
    <a href="{% url 'student_list' %}" class="btn btn-secondary">Back to Student List</a>
  
</div>
{% endblock content %}
