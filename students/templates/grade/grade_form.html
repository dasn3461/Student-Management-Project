{% extends 'Students/base.html' %}


{% block content %}
<div class="container" style="margin-top: 70px; min-height: 600px;">
    <h1>{% if form.instance.pk %}Update{% else %}Assign{% endif %} Grade</h1>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>

        <br>
        <a href="{% url 'grade_list' %}" class="btn btn-secondary">Back to grade list</a>
  
</div>
{% endblock content %}
